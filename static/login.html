<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>News Radar</title>
<style>
  /* 底圖就是 07.png 本人（畫上去的那張卡已抹掉）。三種顏色是 tools/make_login_bg.py
     事先算好的三張圖 —— 圖案一個像素都沒動，只換色相 */
  body[data-bg="purple"] { --ink: #3b2568; }
  body[data-bg="amber"]  { --ink: #6b3327; }
  body[data-bg="sage"]   { --ink: #2f4238; }

  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; display: grid; place-items: center; overflow: hidden;
    font-family: -apple-system, "PingFang TC", "Noto Sans TC", system-ui, sans-serif;
    color: #fff; background: #2b1c55;
  }
  .bg {
    /* 原圖比例 2.06，螢幕多半是 1.78，左右一定會被裁掉一點。
       取景偏右，把右邊的木屋留住 —— 左邊那幾棵樹裁掉一點看不出來 */
    position: fixed; inset: 0; width: 100%; height: 100%;
    object-fit: cover; object-position: 78% 50%;
    pointer-events: none; user-select: none;
  }
  .card {
    position: relative; z-index: 1; width: min(92vw, 400px); padding: 42px 38px 36px;
    border-radius: 24px; border: 1px solid rgba(255,255,255,.30);
    background: rgba(255,255,255,.12); backdrop-filter: blur(18px);
    box-shadow: 0 18px 60px rgba(0,0,0,.32);
  }
  h1 { margin: 0 0 34px; text-align: center; font-size: 34px; letter-spacing: .02em; }
  label { display: block; font-size: 15px; font-weight: 600; margin-bottom: 8px; opacity: .92; }
  input {
    width: 100%; font: inherit; font-size: 18px; color: #fff; padding: 8px 2px;
    background: transparent; border: 0; border-bottom: 2px solid rgba(255,255,255,.75);
  }
  input:focus { outline: 0; border-bottom-color: #fff; }
  button {
    width: 100%; margin-top: 34px; font: inherit; font-size: 18px; font-weight: 700;
    padding: 14px; border: 0; border-radius: 26px; cursor: pointer;
    background: #fff; color: var(--ink);
  }
  button:disabled { opacity: .6; cursor: default; }
  .err { margin-top: 16px; min-height: 22px; text-align: center; font-size: 15px; color: #ffd4d4; }
</style>
</head>
<body>
  <img class="bg" id="bg" alt="">

  <form class="card" id="form">
    <h1>Login</h1>
    <label for="pw">Password</label>
    <input type="password" id="pw" autocomplete="current-password" autofocus required>
    <button type="submit" id="go">Log in</button>
    <div class="err" id="err" role="alert"></div>
  </form>
<script>
  const BACKGROUNDS = ["purple", "amber", "sage"];
  // 網址帶 ?bg=sage 可以指定，冒煙測試靠這個拍固定的截圖
  const picked = new URLSearchParams(location.search).get("bg")
    || BACKGROUNDS[Math.floor(Math.random() * BACKGROUNDS.length)];
  document.body.dataset.bg = picked;
  document.getElementById("bg").src = `/login-bg-${picked}.png`;

  const form = document.getElementById("form");
  const go = document.getElementById("go");
  const err = document.getElementById("err");

  form.onsubmit = async e => {
    e.preventDefault();
    go.disabled = true;
    err.textContent = "";
    try {
      const r = await fetch("/api/login", {
        method: "POST", headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ password: document.getElementById("pw").value }),
      });
      if (!r.ok) throw new Error((await r.json()).error);
      location.href = "/main";
    } catch (e) {
      err.textContent = "✕ " + e.message;
      go.disabled = false;
      document.getElementById("pw").select();
    }
  };
</script>
</body>
</html>

/* ---------- 估值：現在的價格 vs 這家公司自己的過去 ---------- */
// 不到百億就留一位小數。6.3 億寫成「6 億」的話，回購殖利率會對不上帳（6/213 = 2.8%，實際 2.9%）
const money = v => v >= 1e12 ? (v / 1e12).toFixed(2) + " 兆"
  : (v / 1e8).toFixed(v >= 1e10 ? 0 : 1) + " 億";

function splitHTML(s) {
  // 股價 = 每股盈餘 × 本益比，所以漲幅也拆成這兩截，相乘會等於總漲幅
  const line = (label, pct, color, note) => {
    const w = Math.min(100, Math.abs(pct) / Math.max(1, Math.abs(s.earnings), Math.abs(s.multiple)) * 100);
    return `<div class="valu-line">
      <span class="vl">${esc(label)}</span>
      <span class="vt"><i style="width:${w}%;background:${color}"></i></span>
      <span class="vn" style="color:${color}">${pct > 0 ? "+" : ""}${pct}%</span>
    </div>${note ? `<div class="caveat" style="margin:-2px 0 4px">${note}</div>` : ""}`;
  };
  const good = "var(--good)", bad = "var(--critical)";
  return `<div class="valu-split">
    ${line("公司真的多賺", s.earnings, s.earnings >= 0 ? good : bad,
      `每股盈餘 ${s.eps_from} → ${s.eps_to} 美元`)}
    ${line("市場多付錢", s.multiple, s.multiple >= 0 ? bad : good,
      "本益比自己的變化。這一截是情緒，會還回去。")}
    <div class="valu-line" style="border-top:1px solid var(--grid);padding-top:9px">
      <span class="vl"><b>股價總共</b></span><span></span>
      <span class="vn">${s.price > 0 ? "+" : ""}${s.price}%</span>
    </div>
  </div>
  <div class="caveat">兩截相乘會等於總漲幅（不是相加，因為是連乘）。
    「市場多付錢」那截越大，這波漲越靠情緒撐著。</div>`;
}

// 折線的 y 座標：viewBox 高 20，上面留 2 當呼吸空間。SVG 和游標小圓點共用同一條算式。
const peY = (v, lo, span) => 20 - (v - lo) / span * 18;

function peSparkHTML(p) {
  const vals = p.spark.map(s => s.pe);
  const lo = Math.min(...vals), hi = Math.max(...vals), span = hi - lo || 1;
  const pts = p.spark.map((s, i) =>
    `${(i / (p.spark.length - 1) * 100).toFixed(2)},${peY(s.pe, lo, span).toFixed(2)}`);
  const up = vals[vals.length - 1] >= vals[0];
  return `<div class="pespark" id="peSpark">
    <svg viewBox="0 0 100 20" preserveAspectRatio="none" aria-hidden="true">
      <polyline points="${pts.join(" ")}" fill="none" stroke="${up ? "var(--critical)" : "var(--good)"}" stroke-width="1.2"/>
      <line class="pk-x" x1="0" x2="0" y1="0" y2="20" stroke="var(--text-muted)" stroke-width=".5"/>
    </svg>
    <i class="pk-dot"></i>
    <div class="pk-ends"><span>${esc(p.spark[0].d)}</span><span>${esc(p.spark[p.spark.length - 1].d)}</span></div>
    <div class="pk-read" id="peRead">← 在線上左右滑動，看當時的股價與本益比</div>
  </div>`;
}

function wirePeSpark(p) {
  const box = $("#peSpark"), read = $("#peRead");
  const vals = p.spark.map(s => s.pe);
  const lo = Math.min(...vals), hi = Math.max(...vals), span = hi - lo || 1;

  const last = p.spark.length - 1;
  const hint = "← 在線上左右滑動，看當時的股價與本益比";

  box.onpointermove = e => {
    const r = box.querySelector("svg").getBoundingClientRect();
    const i = Math.min(last, Math.max(0, Math.round((e.clientX - r.left) / r.width * last)));
    const s = p.spark[i], x = i / last * 100;
    // 拿那天的本益比去比整段區間，答的是「那天貴不貴」，不是今天
    const pct = p.high > p.low ? Math.round((s.pe - p.low) / (p.high - p.low) * 100) : 50;
    box.classList.add("pk-on");
    box.querySelector(".pk-x").setAttribute("x1", x);
    box.querySelector(".pk-x").setAttribute("x2", x);
    box.querySelector(".pk-dot").style.cssText = `left:${x}%;top:${peY(s.pe, lo, span) * 5}%`;
    read.innerHTML = `<b>${esc(s.d)}</b>　股價 <b>$${s.px}</b> ÷ 當時盈餘 <b>${s.eps}</b>
      ＝ 本益比 <b>${s.pe}</b>　<em>當時落在區間第 ${pct}%</em>`;
  };
  box.onpointerleave = () => {
    box.classList.remove("pk-on");
    read.textContent = hint;
  };
}

/* ---------- 股價軌道：每季一條斜線，上下撐開這支自己的晃動幅度 ---------- */
const TREND_TONE = { cheap: "var(--good)", fair: "var(--text-primary)", rich: "var(--critical)" };
const TREND_BOX = { W: 1180, H: 340, L: 56, R: 18, T: 14, B: 34 };
// 拖不到這麼多天就當成手滑點了一下，不觸發重算
const TREND_MIN_DRAG_DAYS = 20;

const dayGap = (a, b) => (Date.parse(b) - Date.parse(a)) / 86400000;
const isoAdd = (d, n) => new Date(Date.parse(d) + n * 86400000).toISOString().slice(0, 10);
const clampDay = (d, lo, hi) => (d < lo ? lo : d > hi ? hi : d);
// 斜線在某一天的高度。段頭被裁掉時要用裁切點的高度去算 y 軸範圍，不能拿畫面外的 y0
const segY = (s, d) => s.y0 + (s.y1 - s.y0) * dayGap(s.from, d) / Math.max(dayGap(s.from, s.to), 1);

function trendHTML(d) {
  const t = d.trend;
  if (t.error) {
    return `<h3>股價軌道：現在落在哪？</h3>
      <div class="err">✕ 軌道算不出來：${esc(t.error)}</div>
      <div class="caveat">最常見的原因是這段期間內沒有財報公布日，或是財報前後抓不到足夠的股價。</div>`;
  }
  const n = t.now;
  return `<div class="valu-now" id="trendNow"><b style="color:${TREND_TONE[n.verdict.code]}">$${n.price}</b>
      <span>軌道中心 <b>$${n.fair}</b>，平常晃動 <b>±$${n.sigma}</b>　·　${n.verdict.text}
        （差 ${n.gap > 0 ? "+" : ""}${n.gap}%）</span></div>
    <div id="trendChart"></div>
    <div class="pk-read" id="trendRead">${trendHint(d.years)}</div>
    <div class="trend-legend">
      <span><i class="lg-band lg-in"></i>常走的範圍（±1 個晃動幅度）</span>
      <span><i class="lg-band lg-out"></i>還算正常（±2 個）</span>
      <span><i class="lg-dash"></i>軌道中心</span>
      <span><i class="lg-mark"></i>財報公布日（灰色細實線，下方有日期）</span>
      <span><i class="lg-today"></i>今天（白色虛線，股價只會畫到這裡）</span>
      <span><i class="lg-future"></i>今天之後＝預估，畫到下次財報</span>
      ${d.asof ? `<button type="button" class="valu-btn" id="trendReset"
        onclick="resetTrend()">↺ 回到今天</button>` : ""}
    </div>
    <details class="explain"><summary>這條「合理股價」是怎麼算出來的？（點開看規則）</summary>
      <div class="explainbody">
        <p><strong>沒有預測，全是回歸線和標準差。</strong>三步：</p>
        <ul>
          <li><strong>切段</strong>：每一次財報公布日切一刀，一段就是一季。</li>
          <li><strong>軌道高度</strong>：公布日前 7 天、後 21 天的收盤價取<strong>中位數</strong>
            —— 市場消化完這份財報之後，願意付的價格。</li>
          <li><strong>軌道方向</strong>：那一整段股價的回歸斜率，再混入一點盈餘成長率
            （權重 ${t.eps_weight}，所以<strong>主要是看股價慣性</strong>）。</li>
          <li><strong>帶寬</strong>：最近 5 季、每季財報前後的均價，相鄰兩個的差距取標準差
            —— 這支股票<strong>自己</strong>平常會晃多大，不是套一個固定的 10%。</li>
        </ul>
        <p>⚠️ <strong>跌破下緣不等於該買</strong>。軌道只回答「這個價格對這支自己來說算不算異常」，
          它不知道公司出了什麼事。真的變壞的股票，會一路貼著下緣繼續跌。</p>
      </div></details>`;
}

function trendScale(t, from) {
  const { W, H, L, R, T, B } = TREND_BOX;
  const P = t.points, S = t.segments;
  const d0 = clampDay(from || P[0].d, P[0].d, t.today);
  // 右邊界是最後一段軌道的結尾（下一次財報公布日），不是最後一筆股價 —— 預估那一截要看得到
  const dN = t.segments[t.segments.length - 1].to;
  const days = Math.max(dayGap(d0, dN), 1);

  // y 軸只看畫面上這一段。整段五年一起算的話，放大之後的線會擠成一條平的
  const vis = P.filter(p => p.d >= d0);
  const segs = S.filter(s => s.to >= d0);
  const edges = segs.flatMap(s => [d0 > s.from ? d0 : s.from, s.to]
    .flatMap(d => [segY(s, d) - 2 * s.sigma, segY(s, d) + 2 * s.sigma]));
  const lo = Math.min(...vis.map(p => p.c), ...edges);
  const hi = Math.max(...vis.map(p => p.c), ...edges);

  return { d0, dN, days, vis, segs, lo, hi, today: t.today,
    X: d => L + dayGap(d0, d) / days * (W - L - R),
    Y: v => T + (hi - v) / (hi - lo || 1) * (H - T - B),
    dateAt: x => clampDay(isoAdd(d0, Math.round((x - L) / (W - L - R) * days)), d0, dN) };
}

function trendAxes(svg, sc) {
  const { W, H, L, R, T, B } = TREND_BOX;
  for (let i = 0; i <= 4; i++) {
    const v = sc.lo + (sc.hi - sc.lo) * i / 4;
    svg.append(el("line", { x1: L, x2: W - R, y1: sc.Y(v), y2: sc.Y(v),
      stroke: "var(--line)", "stroke-width": .5 }));
    const tx = el("text", { x: L - 8, y: sc.Y(v) + 4, "text-anchor": "end", class: "axis-txt" });
    tx.textContent = "$" + Math.round(v);
    svg.append(tx);
  }
}

function trendXLabels(svg, sc) {
  const { W, H, L, R, B } = TREND_BOX;
  // 刻度標在財報公布日的縱線上 —— 軌道是被財報切開的，標別的日子沒有意義。
  // 由右往左排，擠不下就犧牲舊的：最靠右的「下一次財報日」才是要看的那一格。
  // 字寬會被 viewBox 拉伸，猜不準，所以先放進畫面實際量，壓到線就拿掉。
  let taken = null;
  for (const d of [sc.dN, ...sc.segs.map(s => s.at).reverse()]) {
    const x = sc.X(d);
    if (x < L - 1 || x > W - R + 1) continue;
    const tx = el("text", { x, y: H - 10, class: "axis-txt tr-xlab",
      "text-anchor": x < L + 56 ? "start" : x > W - R - 56 ? "end" : "middle" });
    tx.textContent = `財報 ${d}`;
    svg.append(tx);
    if (taken !== null && tx.getBoundingClientRect().right + 10 > taken) {
      tx.remove();
      continue;
    }
    taken = tx.getBoundingClientRect().left;
    svg.append(el("line", { class: "tr-xtick", x1: x, x2: x, y1: H - B, y2: H - B + 5,
      stroke: "var(--text-muted)", "stroke-width": .8 }));
  }
}

function trendBody(sc) {
  const { W, H, L, R, T, B } = TREND_BOX;
  const g = el("g", { "clip-path": "url(#trendClip)" });
  // 帶子從外層畫到內層，重疊處自然變深 —— 不用算第二種顏色
  for (const k of [2, 1]) {
    for (const s of sc.segs) {
      g.append(el("path", {
        d: `M${sc.X(s.from)},${sc.Y(s.y0 + k * s.sigma)} L${sc.X(s.to)},${sc.Y(s.y1 + k * s.sigma)}
            L${sc.X(s.to)},${sc.Y(s.y1 - k * s.sigma)} L${sc.X(s.from)},${sc.Y(s.y0 - k * s.sigma)} Z`,
        fill: "var(--warning)", opacity: k === 2 ? .12 : .16 }));
    }
  }
  for (const s of sc.segs) {
    g.append(el("line", { class: "tr-mid", x1: sc.X(s.from), x2: sc.X(s.to),
      y1: sc.Y(s.y0), y2: sc.Y(s.y1),
      stroke: "var(--warning)", "stroke-width": 1.4, "stroke-dasharray": "5 4", opacity: .85 }));
    g.append(el("line", { x1: sc.X(s.at), x2: sc.X(s.at), y1: T, y2: H - B,
      stroke: "var(--text-muted)", "stroke-width": .5, opacity: .45, class: "trend-mark" }));
  }
  trendFuture(g, sc);
  // 點圖而不是折線：收盤價本來就是一天一個點，連起來會假裝中間那段也有資料
  const n = sc.vis.length;
  const r = n > 800 ? 1.1 : n > 220 ? 1.7 : n > 90 ? 2.4 : 3.2;
  for (const p of sc.vis) {
    g.append(el("circle", { class: "tr-pt", cx: sc.X(p.d), cy: sc.Y(p.c), r,
      fill: "var(--series-1)" }));
  }
  return g;
}

function trendFuture(g, sc) {
  const { T, H, B } = TREND_BOX;
  const s = sc.segs[sc.segs.length - 1];
  if (s.to <= sc.today) return;
  const a = sc.today > s.from ? sc.today : s.from;
  // 今天之後那一截沒有股價可以對照，帶子邊緣畫成虛線，免得看起來像已經發生的事
  for (const k of [-1, 1]) {
    g.append(el("path", { class: "tr-future",
      d: `M${sc.X(a)},${sc.Y(segY(s, a) + k * s.sigma)} L${sc.X(s.to)},${sc.Y(segY(s, s.to) + k * s.sigma)}`,
      fill: "none", stroke: "var(--warning)", "stroke-width": 1.2, "stroke-dasharray": "3 3" }));
  }
  g.append(el("line", { class: "tr-today", x1: sc.X(sc.today), x2: sc.X(sc.today),
    y1: T, y2: H - B, stroke: "var(--text-primary)", "stroke-width": 1,
    "stroke-dasharray": "2 4", opacity: .6 }));
  // 這條白線是「今天」，不是財報日。沒標字的時候，最後一個股價點碰到它會被誤認成碰到右邊的財報線
  const lab = el("text", { class: "axis-txt tr-today-lab", x: sc.X(sc.today) - 7, y: T + 13,
    "text-anchor": "end" });
  lab.textContent = `今天 ${sc.today}`;
  g.append(lab);
}

let trendSc = null;

function drawTrend(t, from) {
  const { W, H, L, R, T, B } = TREND_BOX;
  const sc = trendScale(t, from);
  const svg = el("svg", { viewBox: `0 0 ${W} ${H}`, preserveAspectRatio: "none",
    role: "img", "aria-label": "股價與合理區間軌道" });

  const clip = el("clipPath", { id: "trendClip" });
  clip.append(el("rect", { x: L, y: 0, width: W - L - R, height: H - B }));
  const defs = el("defs");
  defs.append(clip);
  svg.append(defs);

  trendAxes(svg, sc);
  svg.append(trendBody(sc));
  svg.append(el("rect", { class: "tr-sel", x: 0, y: T, width: 0, height: H - T - B,
    fill: "var(--series-1)", opacity: .15 }));
  svg.append(el("line", { class: "tr-x", x1: 0, x2: 0, y1: T, y2: H - B,
    stroke: "var(--text-primary)", "stroke-width": .7, opacity: 0 }));
  svg.append(el("circle", { class: "tr-dot", r: 4, cx: 0, cy: 0,
    fill: "var(--series-1)", opacity: 0 }));

  $("#trendChart").replaceChildren(svg);
  trendXLabels(svg, sc);   // 要量字寬，得等 svg 真的進到畫面上
  trendSc = sc;
  wireTrend(t);
}

function trendHint(years) {
  return `← 在圖上滑動看當天股價；<strong>按住往旁邊拖</strong>可以框一段出來，
    數字會改用那段的<strong>結尾往前 ${years} 年</strong>重算`;
}

function wireTrend(t) {
  const box = $("#trendChart"), read = $("#trendRead");
  const svg = box.querySelector("svg");
  const vx = e => (e.clientX - svg.getBoundingClientRect().left)
    / svg.getBoundingClientRect().width * TREND_BOX.W;
  let anchor = null;

  box.onpointermove = e => {
    const d = trendSc.dateAt(vx(e));
    const p = trendSc.vis.reduce((a, b) =>
      Math.abs(dayGap(b.d, d)) < Math.abs(dayGap(a.d, d)) ? b : a);
    for (const [sel, at] of [[".tr-x", { x1: trendSc.X(d), x2: trendSc.X(d), opacity: .5 }],
                             [".tr-dot", { cx: trendSc.X(p.d), cy: trendSc.Y(p.c), opacity: 1 }]]) {
      for (const k in at) svg.querySelector(sel).setAttribute(k, at[k]);
    }
    if (anchor) trendBand(svg, anchor, d);
    const last = trendSc.segs[trendSc.segs.length - 1];
    read.innerHTML = (d > trendSc.today
      ? `<b>${esc(d)}</b>　還沒發生 —— 軌道中心預估 <b>$${segY(last, d).toFixed(2)}</b>`
      : `<b>${esc(p.d)}</b>　當天股價 <b>$${p.c}</b>`)
      + (anchor ? `　框選中：${esc(anchor < d ? anchor : d)} ～ ${esc(anchor < d ? d : anchor)}` : "");
  };
  box.onpointerleave = () => {
    for (const sel of [".tr-x", ".tr-dot"]) svg.querySelector(sel).setAttribute("opacity", 0);
    read.innerHTML = trendHint(t.years);
  };
  box.onpointerdown = e => {
    anchor = clampDay(trendSc.dateAt(vx(e)), trendSc.d0, trendSc.today);
    box.setPointerCapture(e.pointerId);
  };
  box.onpointerup = e => {
    // 基準日不能是未來 —— 那天的股價還不存在
    const d = clampDay(trendSc.dateAt(vx(e)), trendSc.d0, trendSc.today), a = anchor;
    anchor = null;
    trendBand(svg, d, d);
    if (a && Math.abs(dayGap(a, d)) >= TREND_MIN_DRAG_DAYS) {
      trendFrom = a < d ? a : d;
      loadValu(valuYears, a < d ? d : a);
    }
  };
}

function trendBand(svg, a, b) {
  const x = [trendSc.X(a), trendSc.X(b)];
  svg.querySelector(".tr-sel").setAttribute("x", Math.min(...x));
  svg.querySelector(".tr-sel").setAttribute("width", Math.abs(x[1] - x[0]));
}

function resetTrend() {
  trendFrom = "";
  loadValu(valuYears, "");
}

function peTrapHTML(t) {
  if (!t) return "";
  return `<div class="pe-trap" id="peTrap">⚠️ <strong>這個百分位不能當成「便宜」。</strong>
    這 ${t.years} 年盈餘漲了 <strong>${t.earnings_x} 倍</strong>，股價只漲 <strong>${t.price_x} 倍</strong>
    —— 本益比是被<strong>分母</strong>壓下去的，不是股價變便宜。
    分母是<strong>過去 12 個月已經賺到的錢</strong>；公司賺錢賺到高峰的那一刻，本益比一定最低。
    該問的不是「現在第幾 %」，是<strong>這個盈餘撐不撐得住</strong>。</div>`;
}

const MARK = { true: ["✅", "var(--good)"], false: ["❌", "var(--critical)"], null: ["➖", "var(--text-muted)"] };

function qualityHTML(rows) {
  const ok = rows.filter(r => r.ok === true).length;
  const bad = rows.filter(r => r.ok === false).length;
  const row = r => {
    const [mark, color] = MARK[r.ok];
    const v = r.value === null ? "—"
      : `${r.value > 0 ? "+" : ""}${r.value}${esc(r.unit)}`;
    return `<div class="qa-row"><span class="qm">${mark}</span>
      <span class="qk">${esc(r.ask)}</span>
      <span class="qv" style="color:${color}">${v}</span>
      <span class="qt">${esc(r.text)}<br><em class="qb">比的是：${esc(r.basis)}</em></span></div>`;
  };
  // 結論只看紅燈有幾個。四題全過也不代表該買，只代表「低本益比這件事目前不是陷阱」
  const sum = bad === 0
    ? `<strong style="color:var(--good)">四題沒有一題亮紅燈</strong> —— 分母目前撐得住，
       那本益比低就比較接近真的便宜，而不是盈餘高峰造成的假象。`
    : bad >= 3
      ? `<strong style="color:var(--critical)">四題裡有 ${bad} 題亮紅燈</strong> —— 分母正在鬆動。
         盈餘只要往下一點，本益比自己就會彈回去，股價一毛都不用漲。這種「便宜」最貴。`
      : `<strong style="color:var(--warning)">四題裡有 ${bad} 題亮紅燈、${ok} 題過關</strong> ——
         混合訊號。紅燈那幾題就是接下來每一季財報要盯的地方。`;
  return `<div class="qa">${rows.map(row).join("")}</div>
    <div class="qa-sum">${sum}</div>`;
}

function fairHTML(f, years, pe) {
  const cell = (k, sub, x, when) => `<div class="fair-cell">
    <div class="fk">${esc(k)}</div>
    <div class="fs" style="color:var(--text-muted)">${esc(sub)}（本益比 ${x.pe}）</div>
    <div class="fv">$${x.price}</div>
    <div class="fs" style="color:${x.gap >= 0 ? "var(--good)" : "var(--critical)"}">
      離現在 ${x.gap > 0 ? "+" : ""}${x.gap}%</div>
    ${when ? `<div class="fs" style="color:var(--text-muted)">上次是 ${esc(when)}</div>` : ""}
  </div>`;
  return `<div class="caveat" style="margin:0 0 10px">現在 <b class="hot">$${f.now}</b>，
      滾動一年每股盈餘 <b class="hot">$${f.eps}</b>。下面是<strong>假設盈餘一動不動</strong>，
      只有<strong>市場的態度</strong>回到這 ${years} 年的三種狀態時，股價會是多少。</div>
    <div class="caveat" style="margin:0 0 10px">「冷」和「熱」講的是<strong>市場願意為同樣的盈餘付多少錢</strong>，
      不是股價高低。<strong>冷＝市場最不捧場</strong>（同樣賺 1 元只肯付 ${f.low.pe} 元），
      <strong>熱＝市場最捧場</strong>（同樣賺 1 元肯付 ${f.high.pe} 元）。
      所以「最冷」那一格是<strong>最悲觀的情境</strong>，不是「合理價」。</div>
    <div class="fair">${cell("市場最不捧場", "這 " + years + " 年最冷", f.low, pe.low_at)}${
      cell("市場態度回到中間", "這 " + years + " 年的中位數", f.mid, "")}${
      cell("市場最捧場", "這 " + years + " 年最熱", f.high, pe.high_at)}</div>
    <div class="caveat" style="margin-top:10px">⚠️ 這是<strong>除法，不是預測，更不是目標價</strong>。
      三個數字全部建立在「盈餘不變」上，而盈餘一定會變 ——
      上面四題就是在看它接下來比較可能往哪邊變。
      另外這 ${years} 年的本益比區間是<strong>過去的市場情緒</strong>，
      公司的成長速度換了一檔，市場願意付的倍數本來就不會回到原位。</div>`;
}

function valuHTML(d) {
  const p = d.pe;
  const m = d.margins;
  const span = `${esc(d.from)} ～ ${esc(d.to)}`;
  const years = Array.from({ length: d.years_max - d.years_min + 1 }, (_, i) => d.years_min + i);
  return `<div class="valu-years">
      <label>回看幾年</label>
      <div class="ranges" id="valuYears" role="group" aria-label="回看幾年">
        ${years.map(y => `<label><input type="radio" name="valuYears" value="${y}"
          ${y === d.years ? "checked" : ""}><span>${y} 年</span></label>`).join("")}
      </div>
    </div>

    ${d.asof ? `<div class="caveat" style="margin:-4px 0 10px">🕘 <strong>你框了一段回去看</strong>：
      底下所有數字都退回 <strong>${esc(d.to)}</strong> 那天為止，${esc(d.to)} 之後的股價完全沒被用到。
      本益比區間是從那天<strong>往前 ${d.years} 年</strong>。</div>` : ""}

    <h3>本益比：${d.asof ? `${esc(d.to)} 當時` : "現在"} ${p.now}，這 ${d.years} 年區間 ${p.low} – ${p.high}</h3>
    <div class="valu-now"><b>${p.now}</b><span>落在 ${d.years} 年區間的第 <b>${p.pct}%</b>
      ${p.pct >= 80 ? "比自己平常熱" : p.pct <= 20 ? "比自己平常冷" : "跟自己平常差不多"}</span></div>
    ${peTrapHTML(p.trap)}
    ${rangeBar(`本益比 ${d.years} 年區間`, p.low, p.high, p.now)}
    <div class="caveat" style="margin:0 0 10px">最低 <b>${p.low}</b> 出現在 <b>${esc(p.low_at)}</b>，
      最高 <b>${p.high}</b> 出現在 <b>${esc(p.high_at)}</b>。
      換「回看幾年」區間沒變的話，代表<strong>這兩天都落在比較短的那段期間裡</strong> —— 拉桿沒壞。</div>
    ${peSparkHTML(p)}
    <div class="caveat">走勢是 ${span} 的本益比。本益比 = 當天股價 ÷ 當時<strong>市場已經知道</strong>的
      滾動一年每股盈餘（四季相加，用<strong>財報真正的公布日</strong>算時間差，不是估一個固定天數）。
      共用到 ${d.eps_points} 個季度盈餘數字。</div>

    <h3>這個盈餘撐不撐得住？（本益比的分母體檢）</h3>
    <div class="caveat" style="margin:-4px 0 10px">本益比 = 股價 ÷ 盈餘。盈餘是<strong>分母</strong>。
      分母撐不住，本益比自己就會彈回去 —— 股價一毛都不用漲。四題全是除法，沒有預測。<br>
      ⏱️ 這四題<strong>永遠看最新的一段，不跟著上面的「回看幾年」動</strong>。
      那根拉桿管的是「本益比區間有多寬」，這裡問的是「公司現在的體質」，兩件事。<br>
      比法一律是<strong>跟一年前的同一個位置比（同期比）</strong>，不是跟上一季比 ——
      多數公司有淡旺季，拿 Q4 比 Q3 量到的是季節，不是體質。每一列下面都寫了實際比的是哪兩段。</div>
    ${qualityHTML(d.quality)}

    <h3>如果盈餘不變，本益比回到常態會是多少錢？</h3>
    ${fairHTML(d.fair, d.years, d.pe)}

    <h3>這 ${d.years} 年，股價漲跌是從哪來的？</h3>
    <div class="caveat" style="margin:-4px 0 8px">${span}，跟上面的本益比是同一段時間。</div>
    ${splitHTML(d.split)}

    <h3>公司本身：營收與利潤率（近 ${m.length} 個財年）</h3>
    <div class="valu-grid">${m.map(r => `<div class="valu-cell">
      <div class="vy">${esc(r.year)} 財年</div>
      <div class="vv">${money(r.revenue)}</div>
      <div class="vs">營收年增 ${r.revenue_growth === undefined ? "—"
        : `<span style="color:${r.revenue_growth >= 0 ? "var(--good)" : "var(--critical)"}">${
          r.revenue_growth > 0 ? "+" : ""}${r.revenue_growth}%</span>`}</div>
      <div class="vs">毛利率 ${r.gross_margin ?? "—"}%</div>
    </div>`).join("")}</div>

    ${trendHTML(d)}

    <div class="caveat" style="margin-top:22px">⚠️ <strong>「貴」不是賣出訊號</strong> —— 好公司可以貴十年，
      用「貴」當訊號賣掉微軟的人錯過了十倍。這張卡只回答「現在是不是比自己平常更熱」，
      用來決定<strong>這次買多少</strong>，不是「買不買」。<br>
      盈餘用 Finnhub 的季度數字四季相加（滾動一年），營收與毛利率來自 Yahoo 的年度損益表。</div>`;
}

let valuYears = 5;
// 基準日：空的就是看今天。框選之後才有值，所有數字都退回那天為止重算
let valuEnd = "";
// 軌道圖只是「放大看哪一段」，純顯示用，不影響任何數字
let trendFrom = "";

function openValu() {
  if (!chart.symbol) return;
  $("#valuTitle").textContent = `${chart.symbol} 估值`;
  $("#valuModal").classList.remove("hidden");
  valuEnd = trendFrom = "";
  loadValu(valuYears, "");
}

function loadValu(years, end = valuEnd) {
  valuYears = years;
  valuEnd = end;
  $("#valuBody").innerHTML = `<div class="loading">計算中…</div>`;
  fetch(`/api/valuation?symbol=${encodeURIComponent(chart.symbol)}&years=${years}&end=${end}`)
    .then(r => r.json())
    .then(d => {
      if (d.error) throw new Error(d.error);
      $("#valuBody").innerHTML = valuHTML(d);
      wirePeSpark(d.pe);
      if (!d.trend.error) drawTrend(d.trend, trendFrom);
      $("#valuYears").onchange = e => loadValu(+e.target.value);
    })
    .catch(err => {
      $("#valuBody").innerHTML = `<div class="err">✕ 估值算不出來：${esc(err.message)}</div>
        <div class="caveat">最常見的原因是這家公司在虧損 —— 每股盈餘是負的，本益比就沒有意義。</div>`;
    });
}
function closeValu() { $("#valuModal").classList.add("hidden"); }

/* ---------- 恐慌指數 vs 股價：兩條線、兩個刻度 ---------- */
const VIX_LEVELS = [
  [30, "😱 市場在恐慌", "var(--critical)"],
  [20, "😬 開始緊張", "var(--warning)"],
  [0, "😌 平靜", "var(--good)"],
];

function vixVerdict(c) {
  if (c <= -0.5) return `恐慌指數往上的那幾天，這支<strong>幾乎都在跌</strong>（相關係數 ${c}）—— 它跟著整個市場的情緒走。`;
  if (c <= -0.2) return `恐慌指數往上時，這支<strong>偏向下跌</strong>，但沒有那麼一致（相關係數 ${c}）。`;
  if (c < 0.2) return `這支跟恐慌指數<strong>幾乎沒關係</strong>（相關係數 ${c}）—— 它漲跌的原因多半是自己的事。`;
  return `少見：恐慌指數往上時這支反而<strong>偏向上漲</strong>（相關係數 ${c}）。避險性質的股票才會這樣。`;
}

function vixHTML(d) {
  const [, mood, color] = VIX_LEVELS.find(([v]) => d.vix_now >= v);
  const ranges = chart.ranges.map(x =>
    `<label><input type="radio" name="vrange" value="${x.key}"${x.key === vixRange ? " checked" : ""}>
      <span>${esc(x.label)}</span></label>`).join("");
  const up = d.pct >= 0;
  return `<div class="vix-head">
      <div class="vix-stat">
        <div class="vs-k">${esc(d.symbol)} · ${esc(d.label)}</div>
        <div class="vs-v" style="color:${up ? "var(--good)" : "var(--critical)"}">${up ? "▲ +" : "▼ "}${d.pct}%</div>
      </div>
      <div class="vix-stat">
        <div class="vs-k">VIX 現在</div>
        <div class="vs-v" style="color:${color}">${d.vix_now}<small>${mood}</small></div>
      </div>
      <div class="ranges chart-ranges" id="vixRanges" role="group" aria-label="恐慌指數區間">${ranges}</div>
    </div>
    <div id="vixChart"></div>
    <div class="vix-legend">
      <span><i class="lg-line" style="background:${up ? "var(--good)" : "var(--critical)"}"></i>${esc(d.symbol)} 股價　<em>左軸</em></span>
      <span><i class="lg-area"></i>VIX 恐慌指數　<em>右軸　這段期間 ${d.vix_low}–${d.vix_high}</em></span>
    </div>
    <div class="vix-verdict">${vixVerdict(d.corr)}</div>
    <details class="explain"><summary>VIX 是什麼？這張圖怎麼看？</summary>
      <div class="explainbody">
        <p>VIX 是<strong>整個市場對「未來 30 天會不會大震盪」的下注價格</strong>。
          它不是股票，不分漲跌方向 —— 大跌和大漲都會讓它變高，只是大跌時高得多。</p>
        <ul>
          <li><strong>20 以下</strong>：平靜，市場覺得沒什麼事</li>
          <li><strong>20–30</strong>：緊張，開始有人花錢避險</li>
          <li><strong>30 以上</strong>：恐慌，通常伴隨全市場大跌</li>
        </ul>
        <p><strong>相關係數</strong>是「兩邊每天的漲跌方向有多同步」，範圍 -1 到 +1。
          -1 是完全反向，0 是毫無關係。這段期間用了 ${d.days} 個交易日算出來。</p>
        <p>⚠️ 相關不等於因果，而且<strong>這是在看過去</strong>。VIX 現在低不代表接下來不會有事 ——
          它反映的是市場「此刻的想法」，而市場經常想錯。</p>
      </div></details>`;
}

function drawVix(d) {
  const W = 1230, H = 360, L = 62, R = 52, T = 18, B = 30;
  const pts = d.points;
  const scale = vals => {
    const lo = Math.min(...vals), hi = Math.max(...vals), pad = (hi - lo) * 0.12 || 1;
    const [a, b] = [lo - pad, hi + pad];
    return { a, b, y: v => T + (b - v) / (b - a) * (H - T - B) };
  };
  const price = scale(pts.map(p => p.close));
  const fear = scale(pts.map(p => p.vix));
  const X = i => L + i * (W - L - R) / (pts.length - 1);
  const uid = "v" + Math.random().toString(36).slice(2, 8);

  const svg = el("svg", { viewBox: `0 0 ${W} ${H}`, role: "img",
    "aria-label": `${d.symbol} 股價與 VIX 恐慌指數 ${d.label}對照` });

  const defs = el("defs");
  const grad = el("linearGradient", { id: uid, x1: 0, y1: 0, x2: 0, y2: 1 });
  grad.appendChild(el("stop", { offset: "0%", "stop-color": "var(--warning)", "stop-opacity": .30 }));
  grad.appendChild(el("stop", { offset: "100%", "stop-color": "var(--warning)", "stop-opacity": .02 }));
  defs.appendChild(grad);
  svg.appendChild(defs);

  for (let k = 0; k <= 3; k++) {
    const pv = price.a + (price.b - price.a) * k / 3;
    svg.appendChild(el("line", { x1: L, x2: W - R, y1: price.y(pv), y2: price.y(pv),
      stroke: "var(--grid)", "stroke-width": 1 }));
    const lt = el("text", { x: L - 7, y: price.y(pv) + 3.5, "text-anchor": "end", class: "axis-txt" });
    lt.textContent = "$" + pv.toFixed(0);
    const rt = el("text", { x: W - R + 7, y: fear.y(fear.a + (fear.b - fear.a) * k / 3) + 3.5,
      class: "axis-txt vix-tick" });
    rt.textContent = (fear.a + (fear.b - fear.a) * k / 3).toFixed(0);
    svg.append(lt, rt);
  }

  // VIX 先畫、當背景色塊；股價後畫、實線在上面。主角是搜尋的那支股票。
  const line = key => pts.map((p, i) => (i ? "L" : "M") + X(i) + "," + (key === "vix" ? fear : price).y(p[key])).join(" ");
  svg.appendChild(el("path", {
    d: `${line("vix")} L${X(pts.length - 1)},${H - B} L${X(0)},${H - B} Z`,
    fill: `url(#${uid})`, stroke: "none",
  }));
  svg.appendChild(el("path", {
    d: line("vix"), fill: "none", stroke: "var(--warning)", "stroke-width": 1.1,
    opacity: .45, "stroke-linejoin": "round",
  }));
  svg.appendChild(el("path", {
    d: line("close"), fill: "none", stroke: d.pct >= 0 ? "var(--good)" : "var(--critical)",
    "stroke-width": 2.2, "stroke-linejoin": "round", "stroke-linecap": "round",
  }));

  const step = Math.max(1, Math.ceil(pts.length / 6));
  pts.forEach((p, i) => {
    if (i % step && i !== pts.length - 1) return;
    // 頭尾靠邊對齊，不然會壓到左右兩側的刻度數字
    const t = el("text", { x: X(i), y: H - 6, class: "axis-txt",
      "text-anchor": i === 0 ? "start" : i === pts.length - 1 ? "end" : "middle" });
    t.textContent = axisLabel(p.t, d.intraday);
    svg.appendChild(t);
  });

  // 兩條線共用一條垂直線，各自一顆點 —— 同一天的股價和恐慌指數要一起讀才有意義
  const cross = el("line", { y1: T, y2: H - B, stroke: "var(--axis)", "stroke-width": 1,
    "stroke-dasharray": "3 3", opacity: 0 });
  const pdot = el("circle", { r: 4.5, fill: d.pct >= 0 ? "var(--good)" : "var(--critical)",
    stroke: "var(--surface-1)", "stroke-width": 2, opacity: 0 });
  const vdot = el("circle", { r: 4, fill: "var(--warning)",
    stroke: "var(--surface-1)", "stroke-width": 2, opacity: 0 });
  svg.append(cross, pdot, vdot);

  const tip = $("#tip");
  svg.addEventListener("pointermove", ev => {
    const b = svg.getBoundingClientRect();
    const i = Math.max(0, Math.min(pts.length - 1,
      Math.round(((ev.clientX - b.left) / b.width * W - L) / ((W - L - R) / (pts.length - 1)))));
    const p = pts[i];
    cross.setAttribute("x1", X(i)); cross.setAttribute("x2", X(i)); cross.setAttribute("opacity", 1);
    pdot.setAttribute("cx", X(i)); pdot.setAttribute("cy", price.y(p.close)); pdot.setAttribute("opacity", 1);
    vdot.setAttribute("cx", X(i)); vdot.setAttribute("cy", fear.y(p.vix)); vdot.setAttribute("opacity", 1);
    tip.innerHTML = `<div class="th">${esc(tipLabel(p.t, d.intraday))}</div>
      <div class="tr2">${esc(d.symbol)} 股價 $${p.close.toFixed(2)}</div>
      <div class="tr2" style="color:var(--warning)">VIX 恐慌指數 ${p.vix.toFixed(2)}</div>`;
    tip.style.opacity = 1;
    tip.style.left = Math.min(ev.clientX + 14, innerWidth - 280) + "px";
    tip.style.top = (ev.clientY - 68) + "px";
  });
  svg.addEventListener("pointerleave", () => {
    tip.style.opacity = 0;
    [cross, pdot, vdot].forEach(e => e.setAttribute("opacity", 0));
  });

  $("#vixChart").replaceChildren(svg);
}

// 預設區間由後端的 DEFAULT_CHART_RANGE 決定，載入設定時一起填進來
let vixRange = "";
// 抓幾天的新聞。使用者不選，由 config 的 DEFAULT_NEWS_DAYS 說了算
let newsDays = 0;

function loadVix(range) {
  vixRange = range;
  $("#vixBody").innerHTML = `<div class="loading">讀取恐慌指數…</div>`;
  fetch(`/api/vix?symbol=${encodeURIComponent(chart.symbol)}&range=${range}`)
    .then(r => r.json())
    .then(d => {
      if (d.error) throw new Error(d.error);
      $("#vixBody").innerHTML = vixHTML(d);
      drawVix(d);
      $("#vixRanges").onchange = e => loadVix(e.target.value);
    })
    .catch(err => {
      $("#vixBody").innerHTML = `<div class="err">✕ 恐慌指數載入失敗：${esc(err.message)}</div>`;
    });
}

function openVix() {
  if (!chart.symbol) return;
  $("#vixTitle").textContent = `${chart.symbol} vs 恐慌指數`;
  $("#vixModal").classList.remove("hidden");
  loadVix(vixRange);
}
function closeVix() { $("#vixModal").classList.add("hidden"); $("#tip").style.opacity = 0; }

$("#valuClose").onclick = closeValu;
$("#valuModal").onclick = e => { if (e.target.id === "valuModal") closeValu(); };
addEventListener("keydown", e => { if (e.key === "Escape") { closeHeat(); closeCal(); closeValu(); closeVix(); closeRot(); } });

/* ---------- 走勢圖：自己的時間區間，跟新聞天數無關 ---------- */
const chart = { symbol: null, name: "", logo: "", sector: "", basics: null, range: "", data: null, ranges: [] };

fetch("/api/ranges").then(r => r.json()).then(cfg => {
  newsDays = cfg.news_days;
  chart.ranges = cfg.chart;
  chart.range = vixRange = cfg.chart_default;
  $("#chartRanges").innerHTML = cfg.chart.map(x =>
    `<label><input type="radio" name="crange" value="${x.key}"${x.key === chart.range ? " checked" : ""}>
     <span>${esc(x.key)}</span></label>`).join("");
  $("#chartRanges").onchange = e => loadChart(e.target.value);
});

function loadChart(range) {
  chart.range = range;
  if (!chart.symbol) return;
  $("#chart").innerHTML = `<div class="loading">載入 ${esc(range)} 走勢…</div>`;
  fetch(`/api/chart?symbol=${encodeURIComponent(chart.symbol)}&range=${range}`)
    .then(r => r.json())
    .then(d => {
      if (d.error) throw new Error(d.error);
      chart.data = d;
      renderQuote();
      drawChart(d);
      // 報告還沒回來時產業是未知的，這時算出來的判語是拿大盤湊數的，兩秒後又會跳掉。
      // 寧可晚一點出現，也不要先給一個可能結論相反的句子。render() 會補這一次。
      if (chart.basics) loadCompare();
      loadBuyback();
    })
    .catch(err => {
      $("#chart").innerHTML = `<div class="err">✕ 走勢圖載入失敗：${esc(err.message)}</div>`;
    });
}

function rangeBar(title, lo, hi, now) {
  if (!(lo > 0 && hi > lo && now > 0)) return "";
  const p = Math.min(100, Math.max(0, (now - lo) / (hi - lo) * 100));
  // 中間價位是分界：低於一半走綠系（145→90），高於一半走紅系（45→0），各半段內自己漸層。
  const hue = p < 50 ? 145 - p / 50 * 55 : 45 - (p - 50) / 50 * 45;
  const neon = `hsl(${hue.toFixed(0)} 100% 58%)`;
  return `<div class="rbar">
    <div class="rtitle"><span>${title}</span>
      <span class="rlohi">${lo.toFixed(2)}–${hi.toFixed(2)}</span>
      <span class="rpct" style="color:${neon};text-shadow:0 0 7px ${neon}">${p.toFixed(0)}%</span></div>
    <div class="rtrack"><div class="rdot" style="left:${p}%;background:${neon};
      box-shadow:0 0 0 2px var(--surface-1), 0 0 8px 2px ${neon}"></div></div>
  </div>`;
}

function renderQuote() {
  const d = chart.data;
  if (!d) return;
  const up = d.change >= 0;
  const c = up ? "var(--good)" : "var(--critical)";
  const b = chart.basics || {};
  const now = b.price || d.last;
  const bars = rangeBar("今日區間", b.day_low, b.day_high, now)
    + rangeBar("52 週區間", b.year_low, b.year_high, now);
  $("#quote").innerHTML = `
    <div class="idline">
      <span class="sym">${esc(chart.symbol)}</span>
      ${chart.name ? `<span class="co">${esc(chart.name)}</span>` : ""}
      ${chart.logo ? `<span class="logobox"><img src="${esc(chart.logo)}" alt=""
        onerror="this.parentNode.remove()"></span>` : ""}
      ${bars ? `<div class="hilo">${bars}</div>` : ""}</div>
    <div class="last">$${d.last.toFixed(2)}
      <span class="delta" style="color:${c}">${up ? "▲ +" : "▼ "}${d.change.toFixed(2)} (${up ? "+" : ""}${d.pct}%)</span>
      <span class="span">${esc(d.label)}內</span>
    </div>`;
}

function drawChart(d) {
  const W = 760, H = 300, L = 8, R = 92, T = 18, B = 30;
  const pts = d.points;
  if (pts.length < 2) { $("#chart").innerHTML = `<div class="nohit">資料點不足，畫不出走勢。</div>`; return; }

  const vals = pts.map(p => p.close);
  const lo = Math.min(...vals, d.first), hi = Math.max(...vals, d.first);
  const pad = (hi - lo) * 0.12 || 1;
  const y0 = lo - pad, y1 = hi + pad;
  const X = i => L + i * (W - L - R) / (pts.length - 1);
  const Y = v => T + (y1 - v) / (y1 - y0) * (H - T - B);
  const up = d.change >= 0;
  const c = up ? "var(--good)" : "var(--critical)";
  const uid = "g" + Math.random().toString(36).slice(2, 8);

  const svg = el("svg", { viewBox: `0 0 ${W} ${H}`, role: "img", "aria-label": `${chart.symbol} ${d.label}走勢` });

  const defs = el("defs");
  const grad = el("linearGradient", { id: uid, x1: 0, y1: 0, x2: 0, y2: 1 });
  grad.appendChild(el("stop", { offset: "0%", "stop-color": c, "stop-opacity": .22 }));
  grad.appendChild(el("stop", { offset: "100%", "stop-color": c, "stop-opacity": 0 }));
  defs.appendChild(grad);
  svg.appendChild(defs);

  for (let k = 0; k <= 4; k++) {
    const v = y0 + (y1 - y0) * k / 4;
    svg.appendChild(el("line", { x1: L, x2: W - R, y1: Y(v), y2: Y(v), stroke: "var(--grid)", "stroke-width": 1 }));
    const t = el("text", { x: W - R + 8, y: Y(v) + 4, class: "axis-txt" });
    t.textContent = "$" + v.toFixed(2);
    svg.appendChild(t);
  }

  // 區間起點的基準線 —— 漲跌百分比就是拿現價跟這條線比出來的
  svg.appendChild(el("line", {
    x1: L, x2: W - R, y1: Y(d.first), y2: Y(d.first),
    stroke: "var(--text-muted)", "stroke-width": 1, "stroke-dasharray": "4 4", opacity: .7
  }));

  const line = pts.map((p, i) => (i ? "L" : "M") + X(i) + "," + Y(p.close)).join(" ");
  svg.appendChild(el("path", {
    d: `${line} L${X(pts.length - 1)},${Y(y0)} L${X(0)},${Y(y0)} Z`,
    fill: `url(#${uid})`, stroke: "none"
  }));
  svg.appendChild(el("path", {
    d: line, fill: "none", stroke: c, "stroke-width": 2,
    "stroke-linejoin": "round", "stroke-linecap": "round"
  }));

  const step = Math.max(1, Math.ceil(pts.length / 6));
  pts.forEach((p, i) => {
    if (i % step && i !== pts.length - 1) return;
    const t = el("text", { x: X(i), y: H - 8, "text-anchor": "middle", class: "axis-txt" });
    t.textContent = axisLabel(p.t, d.intraday);
    svg.appendChild(t);
  });

  const cross = el("line", { y1: T, y2: H - B, stroke: "var(--axis)", "stroke-width": 1, "stroke-dasharray": "3 3", opacity: 0 });
  const dot = el("circle", { r: 4.5, fill: c, stroke: "var(--surface-1)", "stroke-width": 2, opacity: 0 });
  svg.append(cross, dot);

  const tip = $("#tip");
  svg.addEventListener("pointermove", ev => {
    const b = svg.getBoundingClientRect();
    const i = Math.max(0, Math.min(pts.length - 1,
      Math.round(((ev.clientX - b.left) / b.width * W - L) / ((W - L - R) / (pts.length - 1)))));
    const p = pts[i];
    const diff = p.close - d.first, dpct = diff / d.first * 100;
    cross.setAttribute("x1", X(i)); cross.setAttribute("x2", X(i)); cross.setAttribute("opacity", 1);
    dot.setAttribute("cx", X(i)); dot.setAttribute("cy", Y(p.close)); dot.setAttribute("opacity", 1);
    tip.innerHTML = `<div class="th">${esc(tipLabel(p.t, d.intraday))}</div>
      <div class="tr2">$${p.close.toFixed(2)} · 比 ${esc(d.label)}前 ${diff >= 0 ? "+" : ""}${diff.toFixed(2)} (${diff >= 0 ? "+" : ""}${dpct.toFixed(2)}%)</div>`;
    tip.style.opacity = 1;
    tip.style.left = Math.min(ev.clientX + 14, innerWidth - 280) + "px";
    tip.style.top = (ev.clientY - 52) + "px";
  });
  svg.addEventListener("pointerleave", () => {
    tip.style.opacity = 0; cross.setAttribute("opacity", 0); dot.setAttribute("opacity", 0);
  });

  $("#chart").innerHTML = "";
  $("#chart").appendChild(svg);
}

const axisLabel = (iso, intraday) =>
  intraday ? iso.slice(11, 16) : iso.slice(0, 10).slice(5);

const tipLabel = (iso, intraday) =>
  intraday ? iso.slice(0, 10) + " " + iso.slice(11, 16) : iso.slice(0, 10);
</script>
